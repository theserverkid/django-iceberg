[project]
name = "django-iceberg"
version = "0.1.0"
description = "Django database backend powered by Apache Iceberg and Polars - bringing time travel, cloud-native storage, and blazing-fast analytics to Django"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Django Iceberg Project Contributors"}
]
keywords = [
    "django",
    "database",
    "iceberg",
    "polars",
    "time-travel",
    "cloud-native",
    "analytics",
    "data-lakehouse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "django>=6.0.1",
    "django-filter>=25.2",
    "djangorestframework>=3.16.1",
    "markdown>=3.10",
    "polars>=1.0.0",
    "pyiceberg>=0.7.0",
    "pyarrow>=15.0.0",
    "boto3>=1.34.0",
    "sqlparse>=0.5.0",
    "sqlalchemy>=2.0.45",
    "fsspec>=2026.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-django>=4.7.0",
    "coverage>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/django-iceberg"
Documentation = "https://github.com/yourusername/django-iceberg#readme"
Repository = "https://github.com/yourusername/django-iceberg"
Issues = "https://github.com/yourusername/django-iceberg/issues"
Changelog = "https://github.com/yourusername/django-iceberg/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--reuse-db"

