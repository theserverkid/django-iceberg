name: Release and publish django-iceberg

# Triggers on every human push to master.
# 1. Computes the next patch version from existing git tags.
# 2. Pushes the new tag.
# 3. Builds the wheel/sdist (hatch reads version from pyproject.toml).
# 4. Publishes to PyPI via OIDC trusted publishing.
# 5. Creates a GitHub Release.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Package name:      django-iceberg
#   Owner:             theserverkid
#   Repository:        django-iceberg
#   Workflow filename: publish.yml
#   Environment name:  pypi

on:
  push:
    branches:
      - master

jobs:
  release-and-publish:
    name: Tag, publish to PyPI, and create GitHub Release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing
      contents: write  # push tags and create release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version tag
        id: tag
        run: |
          latest=$(git tag --list 'django-iceberg-v*' \
            | sort -t. -k1,1V -k2,2n -k3,3n \
            | tail -1)

          if [ -z "$latest" ]; then
            new_tag="django-iceberg-v0.1.0"
          else
            version="${latest#django-iceberg-v}"
            IFS='.' read -r major minor patch <<< "$version"
            new_tag="django-iceberg-v${major}.${minor}.$((patch + 1))"
          fi

          echo "latest=${latest:-<none>}, new=${new_tag}"
          echo "new_tag=${new_tag}"        >> "$GITHUB_OUTPUT"
          echo "version=${new_tag#django-iceberg-v}" >> "$GITHUB_OUTPUT"

      - name: Push new tag
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "${{ steps.tag.outputs.new_tag }}" -m "Release ${{ steps.tag.outputs.new_tag }}"
          git push origin "${{ steps.tag.outputs.new_tag }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install hatch
        run: pip install --upgrade hatch

      - name: Build wheel and sdist
        run: |
          hatch version
          hatch build

      - name: Verify with twine
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.new_tag }}" \
            --target master \
            --title "django-iceberg v${{ steps.tag.outputs.version }}" \
            --notes "Automated release of django-iceberg v${{ steps.tag.outputs.version }}." \
            --latest
